<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validator Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b13; --panel:rgba(14,16,28,.94); --line:rgba(255,255,255,.08);
    --text:#e9ebf5; --dim:#8a90a8; --good:#3cf29a; --bad:#ff5468; --warn:#ffb340;
    --accent1:#ff3cac; --accent2:#784ba0; --accent3:#2b86c5;
    --grad:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font-family:inherit;cursor:pointer}
  .mono{font-family:var(--mono)}

  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:stretch;padding:8px;pointer-events:none;flex-wrap:wrap;z-index:5}
  .stat{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:92px}
  .stat .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .stat .v{font-family:var(--mono);font-size:15px;font-weight:700;white-space:nowrap}
  .brand{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;pointer-events:auto}
  .brand b{font-size:15px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{color:var(--dim);font-size:11px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .speed{display:flex;gap:3px;align-items:center;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
  .speed button{background:transparent;border:0;color:var(--dim);padding:6px 8px;border-radius:7px;font-family:var(--mono);font-size:12px}
  .speed button.on{background:rgba(255,255,255,.1);color:var(--text)}
  .chain{display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
  .dot.live{background:var(--good);box-shadow:0 0 8px var(--good)}

  #events{position:fixed;top:72px;left:8px;display:flex;flex-direction:column;gap:6px;z-index:4;max-width:min(380px,calc(100vw - 400px))}
  .chip{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:9px;padding:7px 10px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
  .chip.bad{border-left-color:var(--bad)} .chip.good{border-left-color:var(--good)}
  .chip .t{color:var(--dim);font-family:var(--mono);font-size:11px}

  /* Panel */
  #panel{position:fixed;top:72px;right:8px;bottom:8px;width:370px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;z-index:6;backdrop-filter:blur(8px)}
  #tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);padding:4px}
  #tabs button{flex:1 1 22%;background:none;border:0;color:var(--dim);padding:8px 4px;font-size:12.5px;border-radius:8px;white-space:nowrap}
  #tabs button.on{color:var(--text);background:rgba(255,255,255,.07)}
  #pbody{overflow-y:auto;padding:12px;flex:1}
  .sec{margin-bottom:16px}
  .sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:500}
  .card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card .name{font-weight:700;font-size:14px}
  .card .desc{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.35}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
  .kv span:last-child{font-family:var(--mono)}
  .btn{background:var(--grad);border:0;color:#fff;font-weight:700;border-radius:8px;padding:8px 12px;font-size:13px;white-space:nowrap}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--text)}
  .btn.danger{background:var(--bad)}
  .btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .owned{color:var(--good);font-size:12px;font-weight:700}
  .bar{height:8px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin:6px 0}
  .bar i{display:block;height:100%;background:var(--grad)}
  .tag{font-size:11px;font-family:var(--mono);padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.08)}
  .tag.good{color:var(--good)} .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)}
  input[type=range]{width:100%;accent-color:var(--accent1)}
  input[type=text]{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-family:inherit;font-size:14px}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .badge{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px;opacity:.4}
  .badge.on{opacity:1;border-color:rgba(60,242,154,.4);background:rgba(60,242,154,.06)}
  .badge b{display:block;font-size:13px}
  .lb{display:flex;justify-content:space-between;padding:6px 8px;border-radius:7px;font-size:13px}
  .lb.me{background:rgba(255,60,172,.12);font-weight:700}
  .log{font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);color:#c7cbe0}
  .log .b{font-family:var(--mono);color:var(--dim);margin-right:6px}
  .log.bad{color:#ff98a4} .log.good{color:#8ff7c5} .log.warn{color:#ffd28f}
  .note{font-size:12px;color:var(--dim);line-height:1.45}

  #world{position:fixed;top:66px;left:0;right:390px;bottom:0;z-index:5;display:none;background:radial-gradient(circle at 50% 45%,#1d1648 0%,#07081a 72%)}
  #world.on{display:block}
  #globe{width:100%;height:100%;display:block;touch-action:none}
  .wtop{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
  .wtop > *{pointer-events:auto}
  #wstats{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px}
  #wtip{position:absolute;display:none;background:rgba(10,11,19,.94);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;pointer-events:none;line-height:1.45;z-index:2}
  .wlegend{position:absolute;left:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--dim);line-height:1.6}
  select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-family:inherit;font-size:14px;margin-top:4px}
  select option{background:#131527}
  #ticker{position:fixed;left:8px;bottom:8px;z-index:4;display:flex;flex-direction:column;gap:4px;max-width:min(420px,calc(100vw - 400px));pointer-events:none}
  #ticker div{background:rgba(10,11,19,.75);border-radius:7px;padding:5px 9px;font-size:12px;animation:fade 6s forwards}
  @keyframes fade{0%,80%{opacity:1}100%{opacity:0}}

  #modal{position:fixed;inset:0;background:rgba(5,6,12,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  #modal.on{display:flex}
  #modal .box{background:#12142200;background:#131527;border:1px solid var(--line);border-radius:16px;max-width:460px;width:100%;padding:20px;max-height:90vh;overflow:auto}
  #modal h2{margin:0 0 8px;font-size:20px}
  #modal p{color:#c3c7da;font-size:14px;line-height:1.5;margin:8px 0}

  @media (max-width:760px){
    #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;border-radius:14px 14px 0 0}
    #events{top:auto;bottom:calc(46vh + 8px);max-width:calc(100vw - 16px)}
    #ticker{display:none}
    #world{top:118px;right:0;bottom:46vh}
    .stat{min-width:0;padding:5px 8px}.stat .v{font-size:13px}
    .brand small{display:none}
    .hide-m{display:none}
  }
  #modal a:not(.btn), #pbody .note a{color:#7fc4ff}
  .wlist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .wbtn{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left}
  .wbtn img{width:22px;height:22px;border-radius:5px}
</style>

<body>
<canvas id="scene"></canvas>

<div id="hud">

  <div class="stat"><div class="k">Coins</div><div class="v" id="h-coins"></div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* =========================================================
   CONSTANTS & BALANCE
   ========================================================= */
const VSTAKE = 32_000_000;            // stake needed per validator (mirrors PulseChain's 32M PLS)
const BASE_RATE = 0.0004;             // attestation reward per validator per block (fraction of 32M)
const PROPOSE_CHANCE = 0.10;

const BURN_SHARE = 0.25;              // share of fees burned
const DAY_LEN = 240;                  // blocks per in-game day
const UNBOND_BLOCKS = 60;
const SAVE_KEY = 'vtycoon_save_v1';

const NODE_TYPES = [
  { name:'Refurb Desktop',   cost:400_000,    rel:0.9990,  heat:2, color:0x5b6178, h:1.1, desc:'Cheap. Fails often.', slots:1, pwr:1, minEra:0 },
  { name:'Rack Server',      cost:2_500_000,  rel:0.9996,  heat:3, color:0x2f3550, h:1.9, desc:'Solid all-rounder.', slots:1, pwr:1, minEra:0 },
  { name:'Enterprise Blade', cost:12_000_000, rel:0.99985, heat:4, color:0x1b1e2c, h:2.4, desc:'Rarely fails. Runs hot.', slots:1, pwr:1.2, minEra:0 },
  { name:'ARM Efficiency Node', cost:1_200_000, rel:0.9994, heat:1, color:0x34463a, h:1.0, desc:'Low-power ARM board. Runs cool, half the electricity.', slots:1, pwr:0.5, minEra:0 },
  { name:'Liquid-Cooled Dual Rig', cost:45_000_000, rel:0.99993, heat:3, color:0x14213d, h:2.4, desc:'Runs TWO validators. Needs the Data Hall.', slots:2, pwr:1.6, minEra:2 },
];
const ERAS = [
  { name:'Back Room',           slots:4,  w:8,  d:7,  cost:0 },
  { name:'Server Rack Room',    slots:10, w:12, d:9,  cost:6_000_000 },
  { name:'Data Hall',           slots:24, w:18, d:12, cost:45_000_000 },
  { name:'Multi-Region Campus', slots:48, w:26, d:16, cost:300_000_000 },
];
const INFRA = {
  ups:       { name:'UPS Battery Bank',  cost:300_000,   desc:'Covers grid outages and bridges the gap while the generator starts. Recharges when the grid is back.' },
  generator: { name:'Diesel Generator',  cost:1_500_000, desc:'Runs your room through any outage. Burns 150 coins of fuel per node per block. Takes 5 blocks to start unless you add a transfer switch.' },

  backup4g:  { name:'4G Backup Router',  cost:500_000,   desc:'Keeps you online when the fiber is cut. Patchy: 5% of blocks drop.' },
  satellite: { name:'Satellite Link',    cost:4_000_000, desc:'Rock-solid backup internet. Costs 20 per node per block while in use.' },
};
// Real server-room infrastructure (one-off purchases)
const FACILITY = {
  raised:   { name:'Raised floor', cost:2_000_000, desc:'Cold air is pushed up through perforated tiles in front of the racks. Cooling capacity +25%.' },
  contain:  { name:'Hot/cold aisle containment', cost:5_000_000, req:'raised', desc:'Glass enclosures stop hot and cold air mixing. Cooling capacity +35%. Needs a raised floor.' },
  cabling:  { name:'Structured cabling', cost:1_500_000, desc:'Labelled cable bundles in overhead trays. Node failures −20%.' },
  fire:     { name:'FM-200 fire suppression', cost:4_000_000, desc:'Smoke detection plus clean-agent gas that puts out server fires in seconds, with no water damage. Overheated rooms can catch fire.' },

  pdu:      { name:'Dual power feeds (A+B PDUs)', cost:3_000_000, desc:'Every node gets two power supplies, so nothing crashes when power switches to backup.' },

  ddos:     { name:'DDoS protection', cost:2_000_000, desc:'Filters attack traffic. Without it, DDoS attacks make validators miss blocks.' },
};
const UPS_LEVELS = [null, { cap:30 }, { cap:60, cost:1_000_000 }, { cap:120, cost:3_500_000 }];
const CRAC_MAX = 2, cracCost = () => 3_000_000 * Math.pow(2, S.crac||0);
const FARM_TIERS = [
  { name:'Colocation Cage', slots:4,  cost:20_000_000,  fee:150 },
  { name:'Edge Farm',       slots:12, cost:120_000_000, fee:120 },
  { name:'Hyperscale Hall', slots:40, cost:600_000_000, fee:90 },
];
const MAX_FARMS = 5;
// Cosmetics — kept across Hard Forks
const DECOR = {
  floor:  { label:'Floor', items:[['tiles','Dark tiles',0],['raised','Data-center white',300_000],['epoxy','Gray epoxy',300_000],['wood','Oak planks',400_000],['carbon','Carbon fiber',600_000],['hex','Neon hex',800_000]] },
  wall:   { label:'Walls', items:[['violet','Violet',0,0x3b3550],['slate','Slate',100_000,0x34404f],['white','Clean white',100_000,0xcfd4dd],['charcoal','Charcoal',100_000,0x232428],['forest','Forest green',150_000,0x2e4a3c],['navy','Navy',150_000,0x1f2a4a],['terracotta','Terracotta',150_000,0x7a3e2a],['plum','Plum',200_000,0x5a2147]] },
  accent: { label:'Accent light', items:[['pink','Pink',0,0xff3cac],['cyan','Cyan',150_000,0x2bd4ff],['lime','Lime',150_000,0x9bff3c],['gold','Gold',150_000,0xffc83d],['white','White',150_000,0xffffff],['rainbow','Rainbow cycle',2_000_000,null]] },
  rack:   { label:'Rack paint', items:[['default','Factory finish',0,null],['white','Arctic white',500_000,0xdfe3ea],['black','Matte black',500_000,0x101114],['purple','Royal purple',800_000,0x4b2a7a],['teal','Teal',800_000,0x13595e],['gold','Gold',3_000_000,0x8a6d1d]] },

};

const decorItem = (kind, key) => DECOR[kind].items.find(x => x[0] === key) || DECOR[kind].items[0];
const defaultDecor = () => ({ floor:'tiles', wall:'violet', accent:'pink', rack:'default', light:'cool', props:{} });

const BADGES = [
  ['genesis','Genesis','Activate your first validator'],
  ['ten','Ten Strong','Run 10 validators at once'],
  ['lights','Lights Out, Still Up','Stay powered through 5 grid outages'],
  ['clean','Clean Keys','2,000 validating blocks in a row with no slash'],
  ['lesson','Lesson Learned','Get slashed for the first time'],
  ['whale','Whale Tamer','Keep a whale happy through its trial'],
  ['mania','Mania Rider','Run 5+ validators during a meme-coin mania'],
  ['campus','Campus Mogul','Expand to the Multi-Region Campus'],
  ['hundred','Centimillionaire','Earn 100M coins lifetime'],
  ['forked','Forked','Complete your first Hard Fork'],

  ['networker','Networker','Stake with 3 other companies at once'],
  ['mainnet','Mainnet Operator','Link a real PulseChain validator you run'],
  ['backer','Real Backer','Back 32M+ PLS on real PulseChain validators'],
  ['coop','Co-op Validator','Help your guild launch a real validator'],
];

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function fmt(n){
  const a = Math.abs(n), sg = n<0?'-':'';
  if (a>=1e12) return sg+(a/1e12).toFixed(2)+'T';
  if (a>=1e9) return sg+(a/1e9).toFixed(2)+'B';
  if (a>=1e6) return sg+(a/1e6).toFixed(2)+'M';
  if (a>=1e4) return sg+(a/1e3).toFixed(1)+'K';
  return sg+Math.round(a).toLocaleString();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   STATE
   ========================================================= */
function freshState(keep = {}){
  return {
    v:1, company: keep.company || 'My Staking Co.',
    coins:1_500_000, ownStake:0, deleg:0, whaleStake:0,
    nodes:[{ type:0, status:'ok', hot:false, repairT:0 }],
    era:0, commission:0.10, rep:50, marketing:0, cooling:0, techs:0,
    ups:false, upsCharge:30, generator:false, solar:false, backup4g:false, satellite:false,
    block:0, lifetime:0, forkPoints:keep.forkPoints||0, forks:keep.forks||0,
    badges:keep.badges||{}, stats:{ proposed:0, slashes:0, outagesSurvived:0, cleanBlocks:0 },
    totalBurned:0, mood:1, ev:{}, nextEventAt:90, log:[], incomeEMA:0, unbonding:[],
    season: keep.season || 1, seasonEnd: 3600,
    city: keep.city || null, dels:{}, guildId: keep.guildId || null, guildStake:0, world: keep.world || null,
    fac:{}, crac:0, upsLvl:1, farms:[], decor: keep.decor || defaultDecor(), decorOwned: keep.decorOwned || {},
    lowGfx: keep.lowGfx || false, seenHelp: keep.seenHelp || false, ceo: keep.ceo || 'martha', lastSave: Date.now(),
  };
}
let S = freshState();
const rt = { powered:true, powerSrc:'grid', net:'fibre', netOk:true, temp:22, heatRatio:0, k:0, income:0, cost:0, day:true, flashes:[] };
let speed = 1, tab = 'build', selected = -1, uiHold = false, liveBonus = 0;

function save(){
  try { S.lastSave = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
}
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return null;
    const d = JSON.parse(raw); if (!d || d.v !== 1) return null;
    const base = freshState(); const merged = Object.assign(base, d);
    merged.nodes.forEach(n => { n.assigned = false; if (n.status === 'repairing') n.status = 'broken'; });
    return merged;
  } catch(e) { return null; }
}

function log(msg, cls=''){
  S.log.unshift({ b:S.block, msg, cls }); if (S.log.length > 80) S.log.pop();
  const t = $('#ticker'); const d = document.createElement('div'); d.textContent = msg;
  if (cls==='bad') d.style.color = '#ff98a4'; if (cls==='good') d.style.color = '#8ff7c5'; if (cls==='warn') d.style.color = '#ffd28f';
  t.prepend(d); while (t.children.length > 5) t.lastChild.remove();
}
const active = id => S.ev[id] && S.block < S.ev[id].until;
const totalStake = () => S.ownStake + S.deleg + S.whaleStake + realStake();
const nodeSlots = () => S.nodes.reduce((a,n) => a + (NODE_TYPES[n.type].slots || 1), 0);
const farmSlots = () => (S.farms||[]).reduce((a,f) => a + FARM_TIERS[f.tier].slots, 0);
const totalSlots = () => nodeSlots() + farmSlots();
const capacity = () => totalSlots() * VSTAKE;
const farmUp = f => S.block >= (f.down||0) && !(S.world && S.world.cityDown && (S.world.cityDown[f.city]||0) > S.block);
const upsCap = () => UPS_LEVELS[S.upsLvl||1].cap;
const forkMult = () => 1 + 0.25*S.forkPoints;
const nodePrice = t => Math.round(NODE_TYPES[t].cost * (active('bear') ? 0.5 : 1));
const coolCost = () => Math.round(300_000 * Math.pow(2.2, S.cooling));
const mktCost = () => Math.round(250_000 * Math.pow(2.1, S.marketing));
const techCost = () => Math.round(600_000 * Math.pow(1.9, S.techs));
const maxTechs = () => 2 + S.era*2;
const isDay = () => { const p = (S.block % DAY_LEN)/DAY_LEN; return p > 0.2 && p < 0.75; };
const price = () => 0.00001 * (1 + S.totalBurned/5e9) * S.mood * (active('bear')?0.6:1) * (active('mania')?1.25:1);
const netWorth = () => S.coins + S.ownStake + delegatedTotal() + (S.guildStake||0) + S.nodes.reduce((a,n)=>a+NODE_TYPES[n.type].cost*0.5,0) + (S.farms||[]).reduce((a,f)=>a+FARM_TIERS[f.tier].cost*0.5,0);
function award(id){ if (S.badges[id]) return; S.badges[id] = true; const b = BADGES.find(x=>x[0]===id); log(`🏅 Badge unlocked: ${b[1]}`, 'good'); scene3.react('good'); scene3.applyDecor(); }

/* =========================================================
   EVENTS
   ========================================================= */
const EVENTS = [
  { id:'outage', w:3, ok:()=>true, start(){ const d=randi(20,60); S.ev.outage={until:S.block+d, dark:false, start:S.block}; log('⚡ Grid outage! The power is out.', 'bad');
      if (!S.fac.pdu && (S.ups || S.generator)){ let n = 0; S.nodes.forEach((x,i) => { if (x.status === 'ok' && Math.random() < 0.12){ x.status = 'broken'; n++; fx.spark(i); } });
        if (n) log(`⚡ The switch to backup power crashed ${n} node${n>1?'s':''}. Dual power feeds (A+B PDUs) prevent this.`, 'bad'); } } },
  { id:'fibre', w:2, ok:()=>true, start(){ S.ev.fibre={until:S.block+randi(30,80)}; log('✂️ Fiber line cut down the street. Internet is down.', 'bad'); } },
  { id:'mania', w:2, ok:()=>true, start(){ S.ev.mania={until:S.block+45}; log('🐸 Meme-coin mania! Network fees ×3.', 'good'); } },
  { id:'scare', w:1.5, ok:()=>S.deleg>0, start(){ const p = S.rep>80?0.05:0.15; const lost = S.deleg*p; S.deleg -= lost; S.ev.scare={until:S.block+10}; log(`🌉 Bridge exploit scare: stakers pulled ${fmt(lost)}.`, 'bad'); } },
  { id:'upgrade', w:1, ok:()=>S.nodes.length>=2 && !S.ev.upgrade && !S.outOfSync, start(){ S.ev.upgrade={until:S.block+60, deadline:S.block+60, start:S.block}; log('🛠️ Network upgrade! Patch your nodes within 60 blocks.', 'warn'); } },
  { id:'whale', w:1, ok:()=>capacity()-totalStake() >= 2*VSTAKE && S.whaleStake===0 && !S.pendingWhale, start(){ S.pendingWhale={expires:S.block+30}; log('🐋 Maximus Vane, a crypto whale, wants to stake 64M with you.', 'warn'); showWhale(); } },
  { id:'bear', w:1, ok:()=>true, start(){ S.ev.bear={until:S.block+60}; log('🐻 Bear market. Prices crash. Hardware auction: nodes 50% off!', 'warn'); bearBusts(); } },
  { id:'ddos', w:1.2, ok:()=>rt.k>0, start(){ S.ev.ddos={until:S.block+40}; log(S.fac.ddos ? '🛡️ DDoS attack on your nodes — filtered by your DDoS protection.' : '🌊 DDoS attack! Validators are missing blocks. DDoS protection stops this.', S.fac.ddos?'good':'bad'); } },
  { id:'breakin', w:0.8, ok:()=>!isDay() && S.nodes.length>1, start(){ breakIn(); } },
  { id:'efire', w:0.35, ok:()=>S.nodes.length>2, start(){ fire('An electrical fault started a fire'); } },
  { id:'heat', w:1.5, ok:()=>true, start(){ S.ev.heat={until:S.block+60}; log('🔥 Heatwave. Cooling capacity down 30%.', 'warn'); } },
];
function triggerRandomEvent(){
  const pool = EVENTS.filter(e => e.ok() && !active(e.id));
  S.nextEventAt = S.block + randi(70, 140);
  if (!pool.length) return;
  let r = Math.random()*pool.reduce((a,e)=>a+e.w,0);
  for (const e of pool){ r -= e.w; if (r <= 0){ e.start(); return; } }
}

function fire(reason){
  const i = randi(0, S.nodes.length-1);
  if (S.fac.fire){ log(`🧯 ${reason} at node ${i+1}. FM-200 released and the fire was out in seconds. No damage.`, 'good'); fx.fire(i, true); return; }
  fx.fire(i, false); S.rep = Math.max(0, S.rep - 10); scene3.react('bad');
  if (S.nodes.length > 1){ const t = S.nodes[i].type; scene3.releaseTech(i); S.nodes.splice(i,1); scene3.removeRack(i); selected = -1; scene3.syncRacks();
    const over = totalStake() - capacity(); if (over > 0) S.deleg = Math.max(0, S.deleg - over);
    log(`🔥 ${reason}! Node ${i+1} (${NODE_TYPES[t].name}) burned down. −10 reputation. FM-200 fire suppression would have saved it.`, 'bad'); }
  else { S.nodes[i].status = 'broken'; log(`🔥 ${reason}! Your node is damaged. FM-200 fire suppression stops this.`, 'bad'); }
}
function breakIn(){
  if (S.fac.security){ S.rep = clamp(S.rep + 2, 0, 100); log('🚨 Intruders tried to break in at night. CCTV spotted them and the biometric doors held. +2 reputation.', 'good'); return; }
  const i = randi(0, S.nodes.length-1), t = S.nodes[i].type;
  scene3.releaseTech(i); S.nodes.splice(i,1); scene3.removeRack(i); selected = -1; scene3.syncRacks();
  const over = totalStake() - capacity(); if (over > 0) S.deleg = Math.max(0, S.deleg - over);
  S.rep = Math.max(0, S.rep - 5); scene3.react('bad');
  log(`🦹 Break-in! Thieves stole a ${NODE_TYPES[t].name} overnight. −5 reputation. CCTV + biometric access stops this.`, 'bad');
}
function slash(i){
  const ts = totalStake(); if (ts <= 0) return;
  const loss = VSTAKE*0.05;
  S.ownStake = Math.max(0, S.ownStake - loss*S.ownStake/ts);
  S.deleg = Math.max(0, S.deleg - loss*S.deleg/ts);
  S.deleg *= 0.8;
  if (S.whaleStake > 0){ S.whaleStake = 0; delete S.ev.whale; log('🐋 The whale saw the slash and left.', 'bad'); }
  S.rep = Math.max(0, S.rep - 25); S.stats.slashes++; S.stats.cleanBlocks = 0;
  const n = S.nodes[i]; n.hot = false; n.status = 'broken';
  log(`💥 SLASHED! Node ${i+1} double-signed with its hot backup. Lost ${fmt(loss)} stake and 20% of stakers.`, 'bad');
  award('lesson'); fx.slash(i); scene3.react('slash'); scene3.whaleAngry();
}

/* =========================================================
   GAME TICK (one block)
   ========================================================= */
function tick(){
  S.block++;
  const N = S.nodes.length;
  if (S.block >= S.nextEventAt) triggerRandomEvent();

  // outage bookkeeping
  if (S.ev.outage && S.block >= S.ev.outage.until){ if (!S.ev.outage.dark){ S.stats.outagesSurvived++; log('💡 Grid is back. You stayed powered the whole time.', 'good'); } else log('💡 Grid is back.'); delete S.ev.outage; }
  if (S.ev.fibre && S.block >= S.ev.fibre.until){ delete S.ev.fibre; log('🌐 Fiber repaired.'); }
  for (const id of ['mania','bear','heat','scare','ddos']) if (S.ev[id] && S.block >= S.ev[id].until) delete S.ev[id];
  if (S.pendingWhale && S.block >= S.pendingWhale.expires){ delete S.pendingWhale; closeModal(); log('🐋 The whale got tired of waiting.'); }

  // upgrade
  if (S.ev.upgrade){
    if (S.techs >= 2 && S.block >= S.ev.upgrade.start + 10){ delete S.ev.upgrade; log('🛠️ Your technicians patched every node.', 'good'); }
    else if (S.block >= S.ev.upgrade.deadline){ S.outOfSync = true; delete S.ev.upgrade; log('⛔ Missed the upgrade! Your nodes are out of sync until patched.', 'bad'); scene3.react('bad'); }
  }

  rt.day = isDay();

  // power
  const gridOn = !active('outage');
  let powered = true, src = 'grid';
  const genReady = S.generator && (S.fac.ats || !S.ev.outage || S.block >= S.ev.outage.start + 5);
  if (gridOn) S.upsCharge = Math.min(upsCap(), S.upsCharge + 0.5*upsCap()/30);
  else if (S.ups && S.upsCharge >= 1 && !(genReady && S.fac.ats)){ S.upsCharge -= 1; src = 'ups'; }
  else if (genReady) src = 'gen';
  else { powered = false; src = 'none'; if (S.ev.outage) S.ev.outage.dark = true; }
  rt.powered = powered; rt.powerSrc = src;

  let cost = 0;
  const PW = S.nodes.reduce((a,n) => a + (NODE_TYPES[n.type].pwr || 1), 0);
  if (src === 'grid') cost += (rt.day && S.solar ? 0 : 30) * PW;
  if (src === 'gen')  cost += (rt.day && S.solar ? 75 : 150) * PW;
  cost += S.techs * 40;
  for (const f of S.farms) cost += FARM_TIERS[f.tier].fee * FARM_TIERS[f.tier].slots;

  // internet
  let net = 'fibre', netOk = true;
  if (active('fibre')){
    if (S.satellite){ net = 'sat'; cost += 20*N; }
    else if (S.backup4g) net = '4g';
    else { net = 'none'; netOk = false; }
  }
  rt.net = net; rt.netOk = netOk;

  // heat
  const heatCap = (5 + S.cooling*7 + (S.crac||0)*12) * (1 + (S.fac.raised?0.25:0) + (S.fac.contain?0.35:0)) * (active('heat') ? 0.7 : 1);
  const heatLoad = S.nodes.reduce((a,n)=>a + (n.status==='ok' ? NODE_TYPES[n.type].heat : 0), 0);
  rt.heatRatio = heatLoad/heatCap; rt.temp = 20 + rt.heatRatio*12;
  const failMult = (powered ? (rt.heatRatio > 1 ? 1 + (rt.heatRatio-1)*25 : 1) : 0) * (S.fac.cabling ? 0.8 : 1);
  if (powered && rt.heatRatio > 1.05 && S.nodes.length && Math.random() < 0.004*rt.heatRatio) fire('Overheating set a rack on fire');
  // remote farms: occasional hardware faults fixed by remote hands
  S.farms.forEach(f => { if (farmUp(f) && Math.random() < 0.0003){ f.down = S.block + 15; log(`🛰️ Hardware fault at your ${FARM_TIERS[f.tier].name} in ${f.city}. Remote hands are fixing it (15 blocks).`, 'warn'); } });

  S.nodes.forEach((n,i) => {
    if (n.status === 'ok' && Math.random() < (1 - NODE_TYPES[n.type].rel) * failMult){
      n.status = 'broken'; log(`🔧 Node ${i+1} (${NODE_TYPES[n.type].name}) failed${rt.heatRatio>1?' — overheating':''}.`, 'bad'); fx.spark(i);
    }
    if (n.status === 'repairing'){ n.repairT--; if (n.repairT <= 0){ n.status = 'ok'; log(`✅ Node ${i+1} repaired.`, 'good'); } }
  });

  // validators
  const ts = totalStake();
  const slots = [];
  S.nodes.forEach((n,i) => { n._off = 0; n.validating = false; for (let q = 0; q < (NODE_TYPES[n.type].slots||1); q++) slots.push(i); });
  S.farms.forEach((f,fi) => { f.vCount = 0; for (let q = 0; q < FARM_TIERS[f.tier].slots; q++) slots.push(-1 - fi); });
  const k = Math.min(slots.length, Math.floor(ts / VSTAKE)); rt.k = k;
  const ddos = active('ddos') && !S.fac.ddos;
  const feeMult = active('mania') ? 3 : 1;
  const mult = forkMult() * (liveBonus > 0 ? 1.1 : 1) * realMult();
  if (liveBonus > 0) liveBonus--;
  let reward = 0, online = 0, offline = 0, fees = 0;
  for (let j = 0; j < k; j++){
    const si = slots[j]; let ok;
    if (si >= 0){
      const n = S.nodes[si]; if (!n) continue; n.validating = true;
      ok = powered && netOk && !S.outOfSync && (n.status === 'ok' || n.hot) && !(net === '4g' && Math.random() < 0.05) && !(ddos && Math.random() < 0.3);
      if (!ok) n._off++;
    } else {
      const f = S.farms[-1 - si]; f.vCount++;
      ok = farmUp(f) && !S.outOfSync && !(ddos && Math.random() < 0.3);
    }
    if (ok){
      online++; reward += VSTAKE*BASE_RATE;
      if (Math.random() < PROPOSE_CHANCE){ const f = VSTAKE*PROPOSE_FEE*feeMult; reward += f*(1-BURN_SHARE); fees += f; S.stats.proposed++; if (si >= 0) fx.flash(si); pulses.push({ id: si >= 0 ? 'me' : 'farm' + (-1 - si), kind:'me' }); }
      if (si >= 0 && S.nodes[si].hot && Math.random() < 0.0015) slash(si);
    } else offline++;
  }
  S.nodes.forEach(n => { n.online = n.validating && n._off === 0; });
  S.totalBurned += fees*BURN_SHARE;

  let income = 0;
  if (ts > 0 && reward > 0){
    const own = S.ownStake/ts, others = (S.deleg + S.whaleStake + realStake())/ts;
    income = reward*own + reward*others*S.commission;
  }
  if (k === 0 && S.ownStake > 0) income += S.ownStake*BASE_RATE*0.85;   // parked in an outside pool until you can run your own
  income += networkIncome();
  income *= mult;
  const penalty = offline*800;
  S.rep = clamp(S.rep + online*0.004*(S.fac.noc ? 1.25 : 1) - offline*0.08, 0, 100);

  const netIncome = income - cost - penalty;
  S.coins = Math.max(0, S.coins + netIncome);
  S.lifetime += income;
  rt.income = income; rt.cost = cost + penalty;
  S.incomeEMA = S.incomeEMA*0.97 + netIncome*0.03;

  // stakers
  const free = Math.max(0, capacity() - totalStake());
  const attract = (0.3 + S.rep/100) * (1 + S.marketing*0.35) * clamp(1.6 - S.commission*6, 0.1, 1.6);
  S.deleg += Math.min(free, 150_000 * attract * (1 + totalSlots()*0.15));
  let out = 0; if (S.commission > 0.12) out += (S.commission - 0.12)*0.02; if (S.rep < 30) out += 0.002;
  S.deleg -= S.deleg*out;

  // unbonding
  S.unbonding = S.unbonding.filter(u => { if (S.block >= u.at){ S.coins += u.amount; log(`🔓 ${fmt(u.amount)} finished unbonding.`); return false; } return true; });

  // whale trial
  if (S.ev.whale){
    S.ev.whale.total++; if (offline > 0) S.ev.whale.down++;
    if (S.block >= S.ev.whale.until){
      if (S.ev.whale.down / S.ev.whale.total <= 0.02){ S.rep = clamp(S.rep+10,0,100); award('whale'); log('🐋 The whale is happy and staying for good. +10 reputation.', 'good'); }
      else { S.whaleStake = 0; S.rep = clamp(S.rep-15,0,100); log('🐋 Too much downtime. The whale left. −15 reputation.', 'bad'); scene3.react('bad'); }
      delete S.ev.whale;
    }
  }

  // stats & badges
  if (online > 0) S.stats.cleanBlocks++;
  if (k >= 1) award('genesis');
  if (k >= 10) award('ten');
  if (S.stats.outagesSurvived >= 5) award('lights');
  if (S.stats.cleanBlocks >= 2000) award('clean');
  if (active('mania') && online >= 5) award('mania');
  if (S.era >= 3) award('campus');
  if (S.lifetime >= 1e8) award('hundred');

  // market & rivals
  S.mood = clamp(S.mood*(1 + rand(-0.008, 0.008)), 0.5, 1.8);
  worldTick();
  if (S.guildId) award('guild');
  if (Object.keys(S.dels).length >= 3) award('networker');
  if (S.block >= S.seasonEnd){
    const rank = leaderboard().findIndex(x=>x.me) + 1;
    log(`🏁 Season ${S.season} ended. You finished #${rank}. Rival CEO Victor Crane stopped by to gloat.`, rank<=3?'good':'');
    S.season++; S.seasonEnd = S.block + 3600; scene3.rivalVisits();
  }

  // technicians assignment
  assignTechs();
  if (S.block % 10 === 0) save();
  render();
  globe.refresh();
}

function spend(c){ if (S.coins < c) return false; S.coins -= c; return true; }
const actions = {

  expand(){ const e = ERAS[S.era+1]; if (!e || !spend(e.cost)) return; S.era++; log(`🏗️ Moved into the ${e.name}!`, 'good'); scene3.buildRoom(); },

  unstake(a){ const x = Math.floor(S.ownStake*(+a)); if (x <= 0) return; S.ownStake -= x; S.unbonding.push({amount:x, at:S.block+UNBOND_BLOCKS}); log(`⏳ Unstaking ${fmt(x)} (takes ${UNBOND_BLOCKS} blocks).`); },
  repair(a){ const i=+a, n=S.nodes[i]; if (!n || n.status==='ok') return; const c = Math.round(NODE_TYPES[n.type].cost*0.1); if (!spend(c)) return; n.status='ok'; n.assigned=false; scene3.releaseTech(i); log(`🔧 Paid for an emergency repair on node ${i+1}.`); },

  upgradeNode(a){ const i=+a, n=S.nodes[i]; if (!n || n.type>=2) return; const c = nodePrice(n.type+1) - Math.round(NODE_TYPES[n.type].cost*0.5); if (!spend(c)) return; n.type++; n.status='ok'; log(`⬆️ Node ${i+1} upgraded to ${NODE_TYPES[n.type].name}.`); scene3.syncRacks(); },
  sell(a){ const i=+a; if (S.nodes.length<=1) return; const n=S.nodes[i]; S.coins += Math.round(NODE_TYPES[n.type].cost*0.5); scene3.releaseTech(i); S.nodes.splice(i,1); scene3.removeRack(i); selected=-1; const over = totalStake()-capacity(); if (over>0){ const fromD=Math.min(S.deleg,over); S.deleg-=fromD; } log(`Sold node ${i+1}.`); scene3.syncRacks(); },
  patch(){ const c = S.nodes.length*50_000; if (!spend(c)) return; S.outOfSync = false; delete S.ev.upgrade; log('🛠️ All nodes patched.', 'good'); },

    c.nw = Math.max(2e6, c.nw * (1 + g*rand(0.5,1.5)));
    c.rep = clamp(c.rep + (coOnline(c) ? 0.01 : -0.08), 5, 100);
    if (coOnline(c) && Math.random() < (c.rep < 50 ? 0.0006 : 0.00015)){
      c.rep = Math.max(5, c.rep - 20); c.slashed = S.block + 30; c.nw *= 0.97;
      pulses.push({ id:c.id, kind:'slash' });
      if (S.dels[c.id]){ const loss = S.dels[c.id]*0.03; S.dels[c.id] -= loss; log(`💥 ${c.name} got slashed. Your stake with them lost ${fmt(loss)}.`, 'bad'); }
      else if (c.guild && c.guild === S.guildId) log(`💥 Guild member ${c.name} got slashed.`, 'warn');
    }
  });
  // block proposals for the globe
  const on = NET.companies().filter(coOnline);
  for (let i = 0; i < Math.min(5, on.length); i++){ const c = on[randi(0, on.length-1)]; if (Math.random() < 0.6) pulses.push({ id:c.id, kind:'block' }); }
  if (pulses.length > 60) pulses.splice(0, pulses.length - 60);
  // regional outages
  if (S.block >= w.nextRegional){
    w.nextRegional = S.block + randi(120, 260);
    const city = CITIES[randi(0, CITIES.length-1)][0], hit = w.companies.filter(c => c.city === city);
    const dur = randi(20, 50); w.cityDown = w.cityDown || {}; w.cityDown[city] = S.block + dur;
    const myFarm = S.farms.find(f => f.city === city); if (myFarm) log(`🛰️ Grid outage in ${city} took your farm there offline.`, 'bad');
    if (sim && hit.length){ hit.forEach(c => { c.down = S.block + randi(20, 50); pulses.push({ id:c.id, kind:'down' }); });
      log(`🌍 Grid outage in ${city}: ${hit.length} compan${hit.length>1?'ies':'y'} offline.`, hit.some(c => S.dels[c.id] || c.guild === S.guildId) ? 'warn' : ''); }
  }
  // new companies join
  if (sim && S.block >= w.nextJoin){
    w.nextJoin = S.block + randi(60, 150);
    if (w.companies.length < 90){
      const c = randomCompany(); if (!w.companies.some(x => x.name === c.name)){
        if (Math.random() < 0.5) c.guild = w.guilds[randi(0, w.guilds.length-1)].id;
        w.companies.push(c); pulses.push({ id:c.id, kind:'join' });
        log(`🌍 New validator company: ${c.name} joined from ${c.city} ${FLAGS(c.cc)}.`);
      }
    }
  }
  // your own guild attracts members
  const mine = sim && guild('g_me');
  if (mine && S.block % 40 === 0 && Math.random() < 0.15 + S.rep/250 + Math.min(0.3, S.guildStake/1e9)){
    const free = w.companies.filter(c => !c.guild); const c = free[randi(0, free.length-1)];
    if (c){ c.guild = 'g_me'; log(`🤝 ${c.name} (${c.city}) joined your guild ${mine.name}!`, 'good'); }
  }
}

function bearBusts(){

// rewards from staking with others and from your guild
function networkIncome(){
  let inc = 0;
  for (const [id, amt] of Object.entries(S.dels)){
    const c = company(id); if (!c) continue;
    if (coOnline(c)) inc += amt * UNIT_RATE * DELEGATE_EFF * (1 - c.comm);
  }
  const g = S.guildId && guild(S.guildId);
  if (g){
    const tot = guildTotal(g), vals = guildVals(g);
    if (vals > 0 && tot > 0){
      const R = vals * VSTAKE * UNIT_RATE * GUILD_EFF * guildUptime(g);
      const share = S.guildStake / tot;
      inc += R * share * (g.founder === 'me' ? 1 : 1 - g.fee);
      if (g.founder === 'me') inc += R * (1 - share) * g.fee;
    }
  }
  return inc * (active('mania') ? 1.6 : 1);
}

let lastPanel = '';
// Update the panel in place: only nodes that actually changed are touched, so buttons stay put under the pointer.
const morphTpl = document.createElement('template');
function morph(el, html){ morphTpl.innerHTML = html; morphKids(el, morphTpl.content); }
function morphKids(a, b){
  const an = [...a.childNodes], bn = [...b.childNodes];
  for (let i = 0; i < bn.length; i++){
    const x = an[i], y = bn[i];
    if (!x){ a.appendChild(y.cloneNode(true)); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName){ a.replaceChild(y.cloneNode(true), x); continue; }
    if (x.nodeType === 3 || x.nodeType === 8){ if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    if ((x.tagName === 'INPUT' || x.tagName === 'SELECT') && document.activeElement !== x){
      if (x.tagName === 'INPUT' && x.type !== 'range' && x.value !== (y.getAttribute('value') ?? '')) x.value = y.getAttribute('value') ?? '';
      if (x.tagName === 'INPUT' && x.type === 'range') x.value = y.getAttribute('value');
    }
    if (x.tagName === 'SELECT'){ morphKids(x, y); const sel = [...y.children].findIndex(o => o.hasAttribute('selected')); if (sel >= 0 && document.activeElement !== x) x.selectedIndex = sel; continue; }
    if ('disabled' in x) x.disabled = y.hasAttribute('disabled');
    morphKids(x, y);
  }
  for (let i = an.length - 1; i >= bn.length; i--) an[i].remove();
}

   LIVE CHAIN HEARTBEAT (PulseChain public RPC)
   ========================================================= */
const chain = { live:false, block:0, fails:0 };
async function pollChain(){
  try {
    const r = await fetch('https://rpc.pulsechain.com', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_blockNumber',params:[]}) });
    const j = await r.json(); const b = parseInt(j.result, 16);
    if (b && b !== chain.block){ if (chain.live) liveBonus = 5; chain.block = b; chain.live = true; }
    chain.fails = 0;
  } catch(e){ chain.fails++; chain.live = false; }
  if (chain.fails < 3) setTimeout(pollChain, 10_000);
}

    if (props.noc && props.noc.visible && Math.floor(t*2) !== props.lastNoc){ props.lastNoc = Math.floor(t*2); drawNoc(); }

      if (r.g.scale.y < 1) r.g.scale.y = Math.min(1, r.g.scale.y + dt*2.5);
      U.flash = Math.max(0, U.flash - dt*2.5);
      U.hot.visible = !!n.hot;
      U.leds.forEach(L => {
        let c;

          if (mania){ tmpC.setHSL((t*0.8 + L.ph*0.1)%1, 1, 0.55); c = tmpC.getHex(); }

    });

        else P.armR.rotation.x = sw*0.8;

    if (S.city && S.farms && S.farms.length){ const hq = CITIES.find(c => c[0] === S.city);
      if (hq) S.farms.forEach(f => { const ci = CITIES.find(c => c[0] === f.city); if (!ci) return;
        const a = v3(hq[2], hq[3], 1.005), b = v3(ci[2] + 0.4, ci[3] + 0.4, 1.005), mid = a.clone().add(b).normalize().multiplyScalar(1 + a.distanceTo(b)*0.4);
        const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(a, mid, b).getPoints(40)), new THREE.LineDashedMaterial({ color:0xff3cac, dashSize:0.03, gapSize:0.02 })); ln.computeLineDistances(); arcGroup.add(ln); }); }
    const n = NET.companies(), countries = new Set(n.map(c => c.cc)); if (S.city) countries.add(CITIES.find(c=>c[0]===S.city)?.[1]);
    const st = document.getElementById('wstats');
    if (st) st.textContent = `${n.length + (S.city?1:0)} companies · ${n.reduce((a,c)=>a+coVals(c),0) + rt.k} validators · ${countries.size} countries${g ? ' · showing ' + g.name : ''}`;
  }
  let last = performance.now();
  function loop(){
    raf = requestAnimationFrame(loop);
    const now = performance.now(), dt = Math.min(0.05, (now - last)/1000); last = now;
    while (pulses.length){
      const p = pulses.shift();
      if (p.kind === 'block') ring(p.id, 0xffffff, 0.03);
      else if (p.kind === 'slash') ring(p.id, 0xff3355, 0.09);
      else if (p.kind === 'down') ring(p.id, 0xffb340, 0.07);
      else if (p.kind === 'join'){ refresh(); ring(p.id, 0x3cf29a, 0.12); }
      else if (p.kind === 'me') ring('me', 0xff3cac, 0.06);
    }
    for (let i = fxGroup.children.length - 1; i >= 0; i--){
      const r = fxGroup.children[i]; r.userData.life -= dt;
      if (r.userData.life <= 0){ fxGroup.remove(r); r.geometry.dispose(); r.material.dispose(); continue; }
      const k = 1 - r.userData.life/r.userData.max; r.scale.setScalar(0.001 + k*r.userData.size); r.material.opacity = 1 - k;
    }
    const me = pins.get('me'); if (me) me.head.scale.setScalar(1 + Math.sin(now/250)*0.25);
    controls.update(); renderer.render(scene, camera);
  }
  function focus(id){
    if (!built) return;
    const c = id === 'me' ? (() => { const ci = CITIES.find(x => x[0] === S.city); return ci && { lat:ci[2], lon:ci[3] }; })() : company(id);
    if (!c) return;
    const target = v3(c.lat, c.lon, camera.position.length()); controls.autoRotate = false;
    const from = camera.position.clone(); let k = 0;
    const step = () => { k = Math.min(1, k + 0.05); camera.position.copy(from).lerp(target, k*k*(3-2*k)).setLength(from.length()); if (k < 1) requestAnimationFrame(step); };
    step();
  }
  return {
    open(){ const first = !built; document.getElementById('world').classList.add('on'); ui.worldOpen = true; if (!built) build(); size(); refresh(); if (!raf){ last = performance.now(); loop(); } if (first && S.city) focus('me'); },
    close(){ document.getElementById('world').classList.remove('on'); ui.worldOpen = false; if (raf){ cancelAnimationFrame(raf); raf = null; } pulses.length = 0; },
    refresh(){ if (ui.worldOpen) refresh(); },
    focus,
  };
})();

/* =========================================================
   LOOP, OFFLINE PROGRESS, BOOT
   ========================================================= */
let timer = null;
function setSpeed(x){ speed = x; clearInterval(timer); if (x > 0) timer = setInterval(tick, 1000/x); render(); }

function ensureWorld(){
  if (!S.world || !S.world.companies) S.world = makeWorld(); if (!S.dels) S.dels = {};
  // migrate saves from before the city list changed
  const cityOf = n => CITIES.find(c => c[0] === n);
  if (S.city && !cityOf(S.city)){ S.city = null; setTimeout(() => log('📍 Your old city is no longer on the map. Pick a new one in the Network tab.', 'warn'), 500); }
  (S.farms||[]).forEach(f => { if (!cityOf(f.city)){ const to = CITY_MOVES[f.city] || 'Lagos'; f.city = S.farms.some(x => x.city === to) ? (CITIES.find(c => !S.farms.some(x => x.city === c[0]))||CITIES[0])[0] : to; } });
  S.world.companies.forEach(c => {
    if (RENAMES[c.name]){ const [n, city] = RENAMES[c.name]; c.name = n; c.city = city; }
    if (!cityOf(c.city)) c.city = CITY_MOVES[c.city] || 'Lagos';
    const ci = cityOf(c.city); if (ci && (Math.abs(c.lat - ci[2]) > 1 || Math.abs(c.lon - ci[3]) > 1)){ c.cc = ci[1]; c.lat = ci[2] + rand(-0.6,0.6); c.lon = ci[3] + rand(-0.6,0.6); }
  });
  S.world.guilds.forEach((g, i) => { const m = /^g(\d+)$/.exec(g.id); if (m && GUILD_DEFS[+m[1]]) g.name = GUILD_DEFS[+m[1]][0]; });
}
function boot(){
  const loaded = load();
  if (loaded){
    S = loaded;
    const secs = Math.min(8*3600, (Date.now() - (S.lastSave||Date.now()))/1000);
    if (secs > 60){
      const gain = Math.max(0, S.incomeEMA) * secs * 0.5;
      S.coins += gain; S.lifetime += gain; S.block += Math.floor(secs);
      S.nextEventAt = S.block + 60; S.seasonEnd = Math.max(S.seasonEnd, S.block + 600);
      S.ev = {}; delete S.pendingWhale; S.outOfSync = false;
      if (gain > 0) setTimeout(() => showModal(`<h2>Welcome back</h2><p>You were away for ${Math.floor(secs/3600)}h ${Math.floor(secs%3600/60)}m. Your validators kept working at half efficiency and earned <b>${fmt(gain)}</b> coins.</p><div class="btns"><button class="btn" data-act="closeModal">Collect</button></div>`), 300);
    }
  }
  ensureWorld();
  scene3.init();
  render(true);
  setSpeed(1);
  if (!S.seenHelp){ S.seenHelp = true; showHelp(); log('Welcome! Start by staking your coins in the Staking tab.', 'good'); }
  pollChain();
  cloudStart();
  addEventListener('visibilitychange', () => { if (document.hidden){ save(); cloudSync(); } });
  addEventListener('beforeunload', save);
}
boot();
</script>
